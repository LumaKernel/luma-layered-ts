name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  check-and-deploy:
    permissions:
      id-token: write
      contents: write
      issues: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eslint-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/eslint-plugin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test-cov
      - run: npm run typecheck
      - run: npm run build
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          use_oidc: true
      - run: npx -q --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
